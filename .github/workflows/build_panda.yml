- name: Fetch panda build system
        run: |
          git clone --depth=1 https://github.com/sunnyhaibin/panda.git panda_build
          cp panda_build/SConstruct panda/SConstruct
          cp panda_build/SConscript panda/SConscript
          cp -r panda_build/board/stm32h7 panda/board/stm32h7
          cp -r panda_build/board/crypto panda/board/crypto
          cp -r panda_build/board/jungle panda/board/jungle
          cp -r panda_build/board/body panda/board/body
          cp -r panda_build/board/boards panda/board/boards
          cp -r panda_build/board/sys panda/board/sys
          cp -r panda_build/board/drivers panda/board/drivers
          cp panda_build/board/main.c panda/board/main.c
          cp panda_build/board/bootstub.c panda/board/bootstub.c
          cp panda_build/board/can.h panda/board/can.h
          cp panda_build/board/main_comms.h panda/board/main_comms.h
          cp panda_build/board/health.h panda/board/health.h
          cp panda_build/board/config.h panda/board/config.h

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi scons python3-pip

      - name: Install Python dependencies
        run: |
          pip install scons pycryptodome
          pip install -e opendbc_repo/

      - name: Build panda firmware
        working-directory: panda
        run: scons -j$(nproc)

      - name: Commit updated firmware binary
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "panda: recompile firmware with updated mazda.h limits"
          file_pattern: "panda/board/obj/**/*.bin"